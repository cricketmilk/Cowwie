<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ifreglen</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Home is a painting with doors in it. The art (art/sanctum.jpg) is the
     page; the signposts painted on it are the navigation. This file adds
     where each sign is, what it opens, a lamp saying whether the app behind
     it is alive, and the SELECTED state: the plank lights up and sparks fly
     off its arrow, the way the painter lit one sign.

     It is also the part of Ifreglen that is a game. The painting boots in
     out of the dark, the lanterns burn and shed embers, the goat's eyes
     breathe, the scene leans with the mouse, a plaque tells you what is
     behind the sign you stand at, choosing a sign zooms through it, and a
     controller works as well as the keyboard. All of it is cheap: one
     canvas, a few gradients, and a synthesiser instead of sound files.

     The painted title and sign names are baked into the art; a text-free
     version of the painting lets this page draw them. Drafts has no painted
     sign, so its plank is drawn here and nailed under Credentials. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #07060C;          /* the painting's sky, so the letterbox is part of it */
    color: var(--text); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }

  /* The frame keeps the painting's aspect (2000x1493) and centres it, so the
     hotspots, which are percentages of the frame, land on the painted signs
     at every window size. */
  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .frame {
    position: relative; aspect-ratio: 2000 / 1493;
    width: min(100vw, calc(100vh * 2000 / 1493)); height: auto;
    transform-origin: 50% 50%;
    transition: transform 420ms cubic-bezier(.4,0,.2,1), filter 420ms ease;
  }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .edge {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 70% at 50% 50%, transparent 60%, rgba(0,0,0,0.5) 100%);
  }
  /* The painting leans a little toward the mouse. Only the art and the
     light layers move; the sign hotspots ride on the same transform so they
     stay on their planks. */
  .lean { position: absolute; inset: 0; }
  .lean.far { transition: transform 80ms linear; }

  /* ----------------------------------------------------------------- boot */
  /* First light: the painting comes up out of the dark, from a blur to a
     sharp image, while the title fades through. Once per shell session;
     later loads just fade in. */
  body.booting .frame { opacity: 0; transform: scale(1.05); filter: blur(10px) brightness(0.25); transition: none; }
  body.lit .frame { opacity: 1; transform: none; filter: none; transition: opacity 900ms ease, transform 1300ms cubic-bezier(.2,.7,.2,1), filter 1200ms ease; }
  .title {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5;
    opacity: 0; transition: opacity 500ms ease;
  }
  .title b {
    font-family: "Ink Free", "Segoe Print", var(--serif); font-weight: 700; font-size: clamp(42px, 7vw, 96px);
    color: #FFE3A6; letter-spacing: 0.04em; transform: rotate(-2deg);
    text-shadow: 0 0 12px rgba(255,227,166,0.9), 0 0 40px rgba(255,157,60,0.7), 0 3px 0 #3A2210, 0 6px 24px #000;
  }
  .title i { display: block; text-align: center; font-family: var(--mono); font-style: normal; font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(255,214,150,0.6); margin-top: 10px; }
  body.titled .title { opacity: 1; }

  /* ------------------------------------------------------------ the light */
  /* Lanterns burn: a warm pool over each painted lantern, flickering on its
     own clock. The goat's eyes breathe red. Both are screen-blended
     gradients, so they only ever add light to the painting. */
  .glow { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; }
  .glow.lantern {
    width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,160,70,0.42) 0%, rgba(255,120,40,0.18) 28%, rgba(255,90,20,0.06) 50%, transparent 70%);
    animation: flicker 2.7s ease-in-out infinite;
  }
  .glow.lantern.b { animation-duration: 3.3s; animation-delay: -1.2s; }
  .glow.lantern.c { animation-duration: 2.2s; animation-delay: -0.6s; }
  .glow.eye {
    width: 4.2%; aspect-ratio: 1; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,70,60,0.55) 0%, rgba(255,40,40,0.2) 40%, transparent 70%);
    animation: breathe 4.6s ease-in-out infinite;
  }
  .glow.eye.r { animation-delay: -0.15s; }
  @keyframes flicker {
    0%, 100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
    23% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    41% { opacity: 0.78; transform: translate(-50%, -50%) scale(0.97); }
    67% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.03); }
    82% { opacity: 0.84; transform: translate(-50%, -50%) scale(0.99); }
  }
  @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  canvas.embers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }

  /* ---------------------------------------------------------------- signs */
  .sign {
    position: absolute; cursor: pointer; border: 0; padding: 0; background: none;
    outline: none; -webkit-appearance: none; overflow: visible; font: inherit;
  }
  /* The plank's arrow shape, as a clip on the glow layer only, so the sparks
     outside the plank are not cut off. Left-post planks point right. */
  .sign .glow {
    position: absolute; inset: 0; opacity: 0;
    clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
    background:
      radial-gradient(70% 90% at 50% 50%, rgba(255,214,140,0.62), rgba(255,170,80,0.22) 60%, transparent 100%);
    mix-blend-mode: screen; transition: opacity 160ms ease-out; border-radius: 0;
  }
  .sign.left .glow { clip-path: polygon(12% 0, 100% 0, 100% 100%, 12% 100%, 0 50%); }
  /* A warm rim just outside the plank, so the glow reads as light on the
     post and the grass, not only as a brighter plank. */
  .sign .halo {
    position: absolute; inset: -18% -6%; opacity: 0; pointer-events: none;
    background: radial-gradient(55% 60% at 50% 50%, rgba(255,180,90,0.35), transparent 70%);
    mix-blend-mode: screen; transition: opacity 220ms ease-out;
  }
  .sign:hover .glow, .sign:focus-visible .glow { opacity: 0.55; }
  .sign:hover .halo, .sign:focus-visible .halo { opacity: 0.5; }
  .sign.selected .glow { opacity: 1; }
  .sign.selected .halo { opacity: 1; }
  .sign:active .glow { opacity: 1; transition: none; }
  .sign .name { position: absolute; left: -9999px; }   /* painted already; for readers */

  /* The drawn plank (Drafts): wood, a dark rim, hand lettering, nailed on. */
  .sign.drawn svg.plank { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.6)); }
  .sign.drawn .glow { clip-path: polygon(0 4%, 86% 4%, 100% 50%, 86% 96%, 0 96%); }
  .sign.drawn text { font-family: "Ink Free", "Segoe Print", var(--serif); font-weight: 700; font-size: 24px; fill: #F4E4BE; letter-spacing: 1px; }
  .sign.drawn.selected text, .sign.drawn:hover text { fill: #FFF6DC; filter: drop-shadow(0 0 4px rgba(255,227,166,0.95)) drop-shadow(0 0 12px rgba(255,157,60,0.7)); }

  /* The sparks: short tapered strokes and two stars flung off the arrow tip,
     in the painter's own orange. Hidden until the sign is selected, then
     they pop out and keep a slow flicker. */
  .sparks {
    position: absolute; top: -45%; width: 58%; height: 190%;
    opacity: 0; pointer-events: none; overflow: visible;
    transform-origin: 0 50%;
  }
  .sign:not(.left) .sparks { left: 92%; }
  .sign.left .sparks { right: 92%; transform: scaleX(-1); transform-origin: 50% 50%; }  /* mirrored in place, so it hangs off the left tip */
  .sign.selected .sparks { opacity: 1; animation: pop 360ms cubic-bezier(.2,1.6,.4,1) both; }
  .sign.left.selected .sparks { animation-name: popL; }
  /* Styled on the <defs> original: a <use> clone takes its paint from there,
     and a selector through .sparks never reaches it. */
  #burst path, #burst polygon {
    fill: #FFB24A; stroke: #FFD58A; stroke-width: 0.6; stroke-linejoin: round;
    filter: drop-shadow(0 0 3px rgba(255,170,70,0.9));
  }
  #burst .s1 { animation: flick 1.9s ease-in-out infinite; }
  #burst .s2 { animation: flick 2.3s ease-in-out infinite 0.4s; }
  #burst .s3 { animation: flick 1.6s ease-in-out infinite 0.9s; }
  @keyframes pop  { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes popL { from { transform: scaleX(-0.2) scaleY(0.2); opacity: 0; } to { transform: scaleX(-1) scaleY(1); opacity: 1; } }
  @keyframes flick { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* The lamp: a little ember at the plank's arrow tip. */
  .lamp {
    position: absolute; width: 1.1%; aspect-ratio: 1; border-radius: 50%;
    background: #3A3240; opacity: 0; transition: opacity 300ms; pointer-events: none;
  }
  .lamp.open { opacity: 1; background: #8E8692; }
  .lamp.running { opacity: 1; background: var(--emerald); box-shadow: 0 0 10px rgba(127,214,168,0.7); }
  .lamp.active { opacity: 1; background: #FFB65C; box-shadow: 0 0 12px rgba(255,182,92,0.9); }

  /* --------------------------------------------------------------- plaque */
  /* The item card: what is behind the sign you are standing at. Parchment on
     a dark board, beside the plank, on the side its arrow points to. */
  .plaque {
    position: absolute; z-index: 4; left: 50%; top: 77%; width: 30%; min-width: 260px; pointer-events: none;
    transform: translate(-50%, 6px); text-align: center;
    background: linear-gradient(180deg, rgba(24,18,38,0.93), rgba(12,9,20,0.95));
    border: 1px solid rgba(221,168,102,0.45); border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 12px 30px rgba(0,0,0,0.6), 0 0 24px rgba(255,157,60,0.12);
    padding: 10px 13px 9px; opacity: 0; transform: translateY(6px);
    transition: opacity 180ms ease, transform 180ms cubic-bezier(.2,.8,.3,1);
  }
  .plaque.on { opacity: 1; transform: translate(-50%, 0); }
  .plaque::before {  /* the nail */
    content: ""; position: absolute; top: 6px; left: 50%; width: 5px; height: 5px; margin-left: -2px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #B98A5A, #2A1608 75%);
  }
  .plaque .n { font-family: "Ink Free", "Segoe Print", var(--serif); font-weight: 700; font-size: 20px; color: #FFE3A6; line-height: 1.1; margin-top: 4px;
    text-shadow: 0 0 6px rgba(255,227,166,0.6), 0 0 16px rgba(255,157,60,0.35); }
  .plaque .t { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: #D9CDB0; margin: 5px 0 7px; line-height: 1.4; }
  .plaque .s { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; color: #A79DB8; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .plaque .s i { width: 7px; height: 7px; border-radius: 50%; background: #3A3240; flex: none; }
  .plaque .s.running i { background: var(--emerald); box-shadow: 0 0 8px rgba(127,214,168,0.8); }
  .plaque .s.active i, .plaque .s.here i { background: #FFB65C; box-shadow: 0 0 8px rgba(255,182,92,0.9); }
  .plaque .s.open i { background: #8E8692; }
  .plaque .k { margin-top: 7px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,214,150,0.45); }
  .plaque .k b { font-weight: 500; color: rgba(255,214,150,0.75); border: 1px solid rgba(255,214,150,0.25); border-radius: 3px; padding: 0 4px; }

  /* ------------------------------------------------------------------ hud */
  .hud {
    position: absolute; left: 1.6%; bottom: 1.4%; z-index: 6;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: rgba(230,220,200,0.55); text-shadow: 0 1px 2px #000;
    display: flex; gap: 14px; align-items: baseline; pointer-events: none;
  }
  .hud .overline { text-transform: uppercase; letter-spacing: 0.3em; font-size: 9px; color: rgba(230,220,200,0.35); }
  .hud b { font-weight: 500; color: rgba(255,214,150,0.85); font-size: 13px; letter-spacing: 0.04em; }
  .hud2 {
    position: absolute; right: 1.6%; bottom: 1.4%; z-index: 6; display: flex; gap: 14px; align-items: center;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: rgba(230,220,200,0.4); text-shadow: 0 1px 2px #000;
  }
  .hud2 .awake { color: rgba(127,214,168,0.8); }
  .hud2 .keys b { font-weight: 500; color: rgba(255,214,150,0.6); border: 1px solid rgba(255,214,150,0.2); border-radius: 3px; padding: 0 4px; margin-right: 2px; }
  .hud2 .pad { color: rgba(255,214,150,0.7); }
  .hud2 .pad[hidden] { display: none; }
  .hud2 button {
    background: none; border: 1px solid rgba(255,214,150,0.2); border-radius: 3px; color: rgba(255,214,150,0.7);
    font: inherit; font-size: 12px; padding: 1px 7px; cursor: pointer; pointer-events: auto;
  }
  .hud2 button:hover { border-color: rgba(255,214,150,0.6); color: #FFE3A6; }
  .hud2 button.off { opacity: 0.4; }
  .toast {
    position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%);
    font-family: var(--serif); font-size: 13px; color: #FFD69A;
    background: rgba(8,6,12,0.86); border: 1px solid rgba(255,182,92,0.35);
    padding: 6px 14px; border-radius: 3px; opacity: 0; transition: opacity 200ms;
    pointer-events: none; z-index: 6;
  }
  .toast.on { opacity: 1; }

  /* ----------------------------------------------------------------- iris */
  /* Choosing a sign: the painting pushes in toward it and the dark closes
     around it, then the app is there. Coming back, it opens again. */
  .iris {
    position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at var(--cx, 50%) var(--cy, 50%), transparent 0%, rgba(4,3,8,0.6) 18%, #07060C 42%);
    transition: opacity 380ms ease-in;
  }
  body.launch .iris { opacity: 1; }
  body.launch .frame { transform: scale(1.1); filter: brightness(1.1); }
  body.launch .plaque { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .sign .glow, .sign .halo, .lamp, .toast, .frame, .plaque, .iris { transition: none; }
    .sign.selected .sparks, #burst .s1, #burst .s2, #burst .s3, .glow.lantern, .glow.eye { animation: none; }
    body.launch .frame { transform: none; }
  }
</style>
</head>
<body class="booting">
<div class="stage">
  <div class="frame" id="frame">
    <div class="lean" id="leanNear">
      <img src="art/sanctum.jpg" alt="Ifreglen: a signpost farm at night. Signs lead to each app." draggable="false">
      <div class="edge"></div>
    </div>
    <div class="lean far" id="leanFar">
      <div class="glow lantern a" style="left:16.6%;top:94%"></div>
      <div class="glow lantern b" style="left:49.6%;top:94.5%"></div>
      <div class="glow lantern c" style="left:84.6%;top:93.5%"></div>
      <div class="glow eye l" style="left:48.8%;top:30.6%"></div>
      <div class="glow eye r" style="left:54.2%;top:31%"></div>
      <canvas class="embers" id="embers"></canvas>
    </div>
    <div class="lean" id="leanSigns"></div>
    <div class="plaque" id="plaque"></div>
  </div>
</div>
<div class="iris" id="iris"></div>
<div class="title" id="title"><b>Ifreglen</b><i>the desk</i></div>
<div class="hud"><span class="overline">Ifreglen</span><b id="clock">--:--</b><span id="date"></span></div>
<div class="hud2">
  <span class="awake" id="awake"></span>
  <span class="pad" id="pad" hidden>&#x1F3AE; controller</span>
  <span class="keys" id="keys"></span>
  <button id="mute" title="Sound">&#9835;</button>
</div>
<div class="toast" id="toast"></div>

<!-- The spark burst, drawn once and cloned per sign. Coordinates are in a
     100x100 box whose left edge sits at the arrow tip. -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="burst">
      <path class="s1" d="M4 50 L34 46 L34 54 Z"/>
      <path class="s2" d="M8 30 L36 14 L39 21 Z"/>
      <path class="s2" d="M8 70 L36 86 L39 79 Z"/>
      <path class="s3" d="M14 40 L40 34 L41 39 Z"/>
      <path class="s3" d="M14 60 L40 66 L41 61 Z"/>
      <polygon class="s1" points="52,8 55,16 63,17 57,22 59,30 52,25 45,30 47,22 41,17 49,16"/>
      <polygon class="s3" points="50,78 52,84 58,85 54,89 55,95 50,91 45,95 46,89 42,85 48,84"/>
    </g>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87B3E"/><stop offset="0.5" stop-color="#95602C"/><stop offset="1" stop-color="#5C3718"/>
    </linearGradient>
  </defs>
</svg>

<script>
// Where each painted sign sits, as percentages of the painting, and what it
// opens. Measured off art/sanctum.jpg (2000x1493); re-measure if the art
// changes. `side` is which post the plank hangs on. `drawn` signs are not in
// the painting; this page draws their plank.
const SIGNS = [
  { id: "launcher",    label: "Home",        side: "right", x: 5.5,  y: 26.0, w: 26.0, h: 11.5, tag: "The signpost. You are standing at it." },
  { id: "roam",        label: "The Wilds",   side: "right", x: 5.5,  y: 38.5, w: 27.0, h: 9.5,  tag: "The open web, inside the fence." },
  { id: "lookout",     label: "Lookout",     side: "right", x: 5.0,  y: 49.5, w: 25.5, h: 10.5, tag: "Watches the boards and registers. Wakes you only when something moved." },
  { id: "credentials", label: "Credentials", side: "right", x: 5.5,  y: 60.5, w: 29.5, h: 10.5, tag: "Licences and certifications, and the day each one runs out." },
  { id: "drafts",      label: "Drafts",      side: "right", x: 6.0,  y: 72.0, w: 24.0, h: 8.6,  tag: "Letters and emails, written from a few facts.", drawn: true },
  { id: "onboarding",  label: "Onboarding",  side: "left",  x: 69.5, y: 39.5, w: 27.0, h: 10.5, tag: "Every new hire, from signed offer to the ninety-day check-in." },
  { id: "trove",       label: "Trove",       side: "left",  x: 70.0, y: 51.0, w: 26.0, h: 9.5,  tag: "Everything you clipped, and where it came from." },
  { id: "forge",       label: "Kenoma",      side: "left",  x: 70.0, y: 61.5, w: 26.0, h: 9.0,  tag: "The coding agent. Give it a task and watch it work." },
  { id: "haruspex",    label: "Haruspex",    side: "left",  x: 69.5, y: 71.5, w: 27.0, h: 9.0,  tag: "Reads the network's entrails. Nothing gets in unseen." },
];
const LEFT_POST = SIGNS.filter((s) => s.side === "right").length;   // signs on the left post point right

const frame = document.getElementById("frame");
const signsLayer = document.getElementById("leanSigns");
const hasApps = !!(window.roost && window.roost.apps);
const store = window.roost && window.roost.store;
const mine = window.roost ? window.roost.app : "launcher";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

for (const s of SIGNS) {
  const b = document.createElement("button");
  b.className = `sign ${s.side}${s.drawn ? " drawn" : ""}`;
  b.dataset.id = s.id;
  b.style.cssText = `left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%`;
  b.title = s.label;
  const plank = s.drawn ? `<svg class="plank" viewBox="0 0 100 36" preserveAspectRatio="none">
      <polygon points="0,2 85,1 100,18 85,35 0,34" fill="#1C0E06"/>
      <polygon points="3,5 84,4 96,18 84,32 3,31" fill="url(#wood)"/>
      <polygon points="3,5 84,4 96,18 84,32 3,31" fill="none" stroke="rgba(255,150,60,0.55)" stroke-width="1.4"/>
      <polyline points="4,6 84,5 95,18" stroke="rgba(255,225,170,0.45)" stroke-width="1.1" fill="none"/>
      <path d="M8 10 Q40 8 78 11 M6 24 Q45 22 80 25 M30 15 q6 1 12 0" stroke="rgba(0,0,0,0.32)" stroke-width="1.3" fill="none"/>
      <circle cx="8" cy="18" r="1.6" fill="#2A1608"/><circle cx="80" cy="18" r="1.6" fill="#2A1608"/>
    </svg>
    <svg class="plank" viewBox="0 0 100 36"><text x="43" y="24" text-anchor="middle" textLength="52" lengthAdjust="spacingAndGlyphs" transform="rotate(-1 43 24)">${s.label}</text></svg>` : "";
  b.innerHTML = plank + `<span class="halo"></span><span class="glow"></span><span class="name">${s.label}</span>` +
    `<svg class="sparks" viewBox="0 0 100 100" preserveAspectRatio="none"><use href="#burst"/></svg>`;
  b.addEventListener("click", () => choose(s));
  signsLayer.appendChild(b);
  const lamp = document.createElement("i");
  lamp.className = "lamp"; lamp.id = `lamp-${s.id}`;
  const cx = s.side === "right" ? s.x + s.w + 0.4 : s.x - 1.5;
  lamp.style.cssText = `left:${cx}%;top:${s.y + s.h / 2 - 0.55}%`;
  signsLayer.appendChild(lamp);
}

// ------------------------------------------------------------------ sound
// A synthesiser, not sound files: a wooden knock when the selection moves,
// a small bell when a sign opens, a low swell at boot. On by default here
// (walking the painting is the game); the HUD button mutes, remembered.
const sfx = (() => {
  let ctx = null, on = true;
  const ac = () => { if (!ctx) { try { ctx = new AudioContext(); } catch { ctx = null; } } return ctx; };
  function knock(gain, pitch, len = 0.12) {
    const c = ac(); if (!c || !on) return; const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(pitch, t); o.frequency.exponentialRampToValueAtTime(pitch * 0.55, t + len * 0.75);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + len + 0.01);
    const n = c.createBufferSource(), buf = c.createBuffer(1, c.sampleRate * 0.035, c.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    n.buffer = buf; const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1300; f.Q.value = 0.9;
    const ng = c.createGain(); ng.gain.value = gain * 0.45; n.connect(f).connect(ng).connect(c.destination); n.start(t);
  }
  function bell(base, gain, len) {
    const c = ac(); if (!c || !on) return; const t = c.currentTime;
    for (const [mul, g0] of [[1, gain], [1.5, gain * 0.4], [2.01, gain * 0.18], [2.98, gain * 0.07]]) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "triangle"; o.frequency.value = base * mul;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(g0, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + len + 0.02);
    }
  }
  function swell() {
    const c = ac(); if (!c || !on) return; const t = c.currentTime;
    for (const [f, g0] of [[55, 0.09], [110, 0.05], [164.8, 0.03], [220, 0.02]]) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(g0, t + 0.9); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + 2.7);
    }
    setTimeout(() => bell(880, 0.05, 1.2), 700);
  }
  return {
    move:  () => knock(0.16, 300, 0.09),
    open:  () => { knock(0.22, 170); bell(660, 0.1, 0.5); setTimeout(() => bell(990, 0.07, 0.6), 110); },
    here:  () => bell(440, 0.06, 0.3),
    swell,
    get on() { return on; }, set on(v) { on = !!v; },
  };
})();
const muteBtn = document.getElementById("mute");
function paintMute() { muteBtn.classList.toggle("off", !sfx.on); muteBtn.title = sfx.on ? "Sound on (M mutes)" : "Sound off (M unmutes)"; }
function toggleSound() { sfx.on = !sfx.on; paintMute(); if (sfx.on) sfx.here(); if (store) store.set("home:sound", sfx.on ? "on" : "off").catch?.(() => {}); }
muteBtn.addEventListener("click", toggleSound);

// -------------------------------------------------------------- selection
// One sign is "selected" at a time: lit, with sparks, its plaque up. It is
// the sign you are standing at. Home until you pick another, which lights
// that sign for the moment before it opens; when you come back, the sign
// you came from stays lit, so Home remembers where you were.
let selected = null, lastList = null;
function select(id, { remember = true, sound = false } = {}) {
  if (sound && id !== selected) sfx.move();
  selected = id;
  for (const b of signsLayer.querySelectorAll(".sign")) b.classList.toggle("selected", b.dataset.id === id);
  paintPlaque(id);
  if (remember && store) store.set("home:selected", id).catch?.(() => {});
}

function choose(s) {
  select(s.id);
  if (s.id === mine) { sfx.here(); toast("You are here."); return; }
  if (!hasApps) { toast(`${s.label}: open me inside Ifreglen to go there`); return; }
  sfx.open();
  // Push in through the sign: the iris closes on it, then the view switches.
  const iris = document.getElementById("iris");
  iris.style.setProperty("--cx", `${s.x + s.w / 2}%`); iris.style.setProperty("--cy", `${s.y + s.h / 2}%`);
  frame.style.transformOrigin = `${s.x + s.w / 2}% ${s.y + s.h / 2}%`;
  document.body.classList.add("launch");
  setTimeout(() => window.roost.apps.open(s.id), reduced ? 60 : 400);
  setTimeout(refresh, 800);
  // Whatever happens, the painting is back within two seconds.
  clearTimeout(choose.timer); choose.timer = setTimeout(unlaunch, 2000);
}
function unlaunch() {
  if (!document.body.classList.contains("launch")) return;
  document.body.classList.remove("launch");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("on"), 1800);
}

// ---------------------------------------------------------------- plaque
function stateOf(s) {
  if (s.id === mine) return { cls: "here", text: "you are here" };
  const a = lastList && lastList.get(s.id);
  if (!a) return { cls: "", text: hasApps ? "not registered" : "inside Ifreglen" };
  if (a.active) return { cls: "active", text: "open now" };
  if (a.running) return { cls: "running", text: "awake" + (a.mb ? ` · ${a.mb} MB` : "") };
  if (a.open) return { cls: "open", text: "hibernating · logins kept" };
  if (a.kind === "local") return { cls: "", text: "asleep · starts when you open it" };
  if (a.kind === "browser") return { cls: "", text: "ready" };
  return { cls: "", text: "ready" };
}
function paintPlaque(id) {
  const p = document.getElementById("plaque");
  const s = SIGNS.find((x) => x.id === id);
  if (!s) { p.classList.remove("on"); return; }
  const st = stateOf(s);
  p.innerHTML = `<div class="n">${s.label}</div><div class="t">${s.tag}</div>` +
    `<div class="s ${st.cls}"><i></i>${st.text}</div>` +
    `<div class="k">${s.id === mine ? "<b>↑↓</b> walk" : "<b>Enter</b> open"}</div>`;
  p.classList.add("on");
}

// -------------------------------------------------------------- the lamps
let seq = 0;
async function refresh() {
  if (!hasApps) return;
  const my = ++seq;
  let r;
  try { r = await window.roost.apps.list(); } catch { return; }
  if (my !== seq || !r || !Array.isArray(r.apps)) return;
  lastList = new Map(r.apps.map((a) => [a.id, a]));
  let awake = 0;
  for (const s of SIGNS) {
    const a = lastList.get(s.id);
    const lamp = document.getElementById(`lamp-${s.id}`);
    lamp.className = "lamp";
    if (!a) continue;
    if (a.active && a.id !== mine) lamp.classList.add("active");
    else if (a.running) lamp.classList.add("running");
    else if (a.open) lamp.classList.add("open");
    if (a.running && a.id !== mine) awake++;
  }
  document.getElementById("awake").textContent = awake ? `${awake} awake` : "";
  if (selected) paintPlaque(selected);
}

// ------------------------------------------------------------------ clock
function paintClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  document.getElementById("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}
paintClock();
setInterval(paintClock, 30000);
document.getElementById("keys").innerHTML = hasApps
  ? `<b>↑↓</b><b>←→</b> walk <b>Enter</b> open <b>Ctrl+1…9</b> jump <b>Ctrl+K</b> find`
  : `<b>↑↓</b><b>←→</b> walk`;

// Keyboard: arrows walk the posts and move the selection; Enter opens.
function walk(dir) {
  const all = [...signsLayer.querySelectorAll(".sign")];
  let i = all.findIndex((b) => b.dataset.id === selected);
  if (i < 0) i = 0;
  if (dir === "down") i = (i + 1) % all.length;
  if (dir === "up") i = (i - 1 + all.length) % all.length;
  if (dir === "right" || dir === "left") {
    // Hop posts, keeping the row where there is one.
    const onLeftPost = i < LEFT_POST;
    const row = onLeftPost ? i : i - LEFT_POST;
    i = onLeftPost ? Math.min(LEFT_POST + row, all.length - 1) : Math.min(row, LEFT_POST - 1);
  }
  select(all[i].dataset.id, { remember: false, sound: true });
  all[i].focus({ preventScroll: true });
}
function open() { const s = SIGNS.find((x) => x.id === selected); if (s) choose(s); }
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { ArrowDown: "down", ArrowUp: "up", ArrowLeft: "left", ArrowRight: "right", s: "down", w: "up", a: "left", d: "right", j: "down", k: "up", h: "left", l: "right" };
  if (map[e.key]) { walk(map[e.key]); e.preventDefault(); }
  else if (e.key === "Enter" || e.key === " ") { open(); e.preventDefault(); }
  else if (e.key === "m" || e.key === "M") toggleSound();
});
// Hovering previews the sparks on that sign without forgetting the real one.
let hovering = null;
signsLayer.addEventListener("mouseover", (e) => {
  const b = e.target.closest(".sign"); if (!b || b === hovering) return;
  hovering = b; sfx.move();
  for (const o of signsLayer.querySelectorAll(".sign")) o.classList.toggle("selected", o === b);
  paintPlaque(b.dataset.id);
});
signsLayer.addEventListener("mouseleave", () => { hovering = null; select(selected, { remember: false }); });

// ---------------------------------------------------------------- gamepad
// A controller walks the signs too: d-pad or left stick moves, A opens,
// Y mutes. Polled only while one is plugged in.
const pad = (() => {
  let raf = 0, held = {}, last = 0;
  function poll(ts) {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    let any = false;
    for (const g of gps) {
      if (!g) continue; any = true;
      const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      const want = {
        up: g.buttons[12]?.pressed || ay < -0.6, down: g.buttons[13]?.pressed || ay > 0.6,
        left: g.buttons[14]?.pressed || ax < -0.6, right: g.buttons[15]?.pressed || ax > 0.6,
        a: g.buttons[0]?.pressed, y: g.buttons[3]?.pressed,
      };
      for (const k of ["up", "down", "left", "right"]) {
        if (want[k] && (!held[k] || ts - held[k] > 260)) { walk(k); held[k] = ts; }
        if (!want[k]) delete held[k];
      }
      if (want.a && !held.a) open(); held.a = want.a;
      if (want.y && !held.y) toggleSound(); held.y = want.y;
    }
    document.getElementById("pad").hidden = !any;
    raf = any ? requestAnimationFrame(poll) : 0;
  }
  window.addEventListener("gamepadconnected", () => { if (!raf) raf = requestAnimationFrame(poll); toast("Controller connected."); });
  window.addEventListener("gamepaddisconnected", () => { document.getElementById("pad").hidden = true; });
  return { start: () => { if (!raf && navigator.getGamepads && [...navigator.getGamepads()].some(Boolean)) raf = requestAnimationFrame(poll); } };
})();
pad.start();

// --------------------------------------------------------------- parallax
// The painting leans toward the mouse: the art a little, the light more,
// the signs with the art. Eased, so it feels like weight rather than a
// cursor.
const lean = (() => {
  let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
  const near = document.getElementById("leanNear"), far = document.getElementById("leanFar");
  function tick() {
    cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;
    near.style.transform = `translate(${cx * 5}px, ${cy * 4}px)`;
    signsLayer.style.transform = near.style.transform;
    far.style.transform = `translate(${cx * 11}px, ${cy * 8}px)`;
    raf = (Math.abs(tx - cx) > 0.002 || Math.abs(ty - cy) > 0.002) ? requestAnimationFrame(tick) : 0;
  }
  function aim(x, y) { tx = x; ty = y; if (!raf) raf = requestAnimationFrame(tick); }
  if (!reduced) {
    document.addEventListener("mousemove", (e) => aim((e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2));
    document.addEventListener("mouseleave", () => aim(0, 0));
  }
  return { rest: () => aim(0, 0) };
})();

// ----------------------------------------------------------------- embers
// Sparks rise from the three lanterns and drift; a few fireflies wander the
// field. One canvas, screen-blended over the painting, idle when hidden.
(() => {
  const cv = document.getElementById("embers"), ctx = cv.getContext("2d");
  if (reduced) { cv.remove(); return; }
  const LANTERNS = [[0.166, 0.94], [0.496, 0.945], [0.846, 0.935]];
  const ps = []; let W = 0, H = 0, raf = 0, last = 0;
  function size() { const r = cv.getBoundingClientRect(); W = cv.width = Math.round(r.width); H = cv.height = Math.round(r.height); }
  function spawn(fly) {
    if (fly) return { fly: true, x: (0.28 + Math.random() * 0.44) * W, y: (0.55 + Math.random() * 0.3) * H, vx: 0, vy: 0, a: Math.random() * 6.28, life: 1, age: 0, max: 6 + Math.random() * 6, r: 1.1 + Math.random() * 0.8 };
    const [lx, ly] = LANTERNS[(Math.random() * 3) | 0];
    return { x: (lx + (Math.random() - 0.5) * 0.02) * W, y: (ly - 0.01) * H, vx: (Math.random() - 0.5) * 8, vy: -(14 + Math.random() * 22), life: 1, age: 0, max: 2.2 + Math.random() * 2.4, r: 0.8 + Math.random() * 1.3 };
  }
  size();
  for (let i = 0; i < 46; i++) { const p = spawn(false); p.age = Math.random() * p.max; ps.push(p); }
  for (let i = 0; i < 9; i++) ps.push(spawn(true));
  function step(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i]; p.age += dt;
      if (p.age > p.max) { ps[i] = spawn(p.fly); continue; }
      const k = p.age / p.max;
      if (p.fly) {
        p.a += (Math.random() - 0.5) * 1.2 * dt * 4; p.vx = Math.cos(p.a) * 9; p.vy = Math.sin(p.a) * 5;
        p.x += p.vx * dt; p.y += p.vy * dt;
        const glow = Math.max(0, Math.sin(k * Math.PI) * (0.55 + 0.45 * Math.sin(ts / 300 + i)));
        ctx.fillStyle = `rgba(200,255,170,${glow * 0.8})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
        ctx.fillStyle = `rgba(160,255,140,${glow * 0.18})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.28); ctx.fill();
      } else {
        p.vx += (Math.random() - 0.5) * 30 * dt; p.vy -= 6 * dt;
        p.x += p.vx * dt * (W / 1000); p.y += p.vy * dt * (H / 750);
        const a = (1 - k) * (0.9 - 0.3 * Math.sin(ts / 90 + i));
        ctx.fillStyle = `rgba(255,${150 + (90 * (1 - k)) | 0},60,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.5), 0, 6.28); ctx.fill();
        if (k < 0.4) { ctx.fillStyle = `rgba(255,170,70,${a * 0.15})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.5, 0, 6.28); ctx.fill(); }
      }
    }
    raf = document.hidden ? 0 : requestAnimationFrame(step);
  }
  const start = () => { if (!raf && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(step); } };
  new ResizeObserver(size).observe(cv); start();
  document.addEventListener("visibilitychange", start);
})();

// ------------------------------------------------------------------- boot
(async () => {
  let last = null, sound = null;
  if (store) {
    try { last = await store.get("home:selected"); } catch {}
    try { sound = await store.get("home:sound"); } catch {}
  }
  if (sound === "off") sfx.on = false;
  paintMute();
  select(SIGNS.some((s) => s.id === last) ? last : mine, { remember: false });
  if (hasApps) {
    refresh();
    setInterval(() => { if (!document.hidden) refresh(); }, 4000);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      refresh(); unlaunch(); lean.rest();
    });
  }
  // First light. Once per session: a reload (live reload, Ctrl+R) just fades.
  let first = true;
  try { first = !sessionStorage.getItem("home:lit"); sessionStorage.setItem("home:lit", "1"); } catch {}
  const body = document.body;
  if (reduced || !first) { body.classList.remove("booting"); body.classList.add("lit"); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    body.classList.remove("booting"); body.classList.add("lit"); sfx.swell();
    setTimeout(() => body.classList.add("titled"), 350);
    setTimeout(() => body.classList.remove("titled"), 1900);
  }));
})();
</script>
</body>
