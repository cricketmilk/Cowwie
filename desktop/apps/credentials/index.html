<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Credentials</title>
<link rel="stylesheet" href="../_shared/ifreglen-ui.css">
<script src="../_shared/ifreglen-ui.js" defer></script>
<style>
  /* Layout only. Colour, type, planks, buttons and motion come from the kit. */
  .bar { grid-area: bar; }
  .card { padding: 12px 14px; cursor: pointer; }
  .cred { padding: 10px 12px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 6px; }

  body { display: grid; overflow: hidden;
    grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; grid-template-areas: "bar bar" "main side"; }
  .main { grid-area: main; overflow-y: auto; padding: 16px 20px; }
  .side { grid-area: side; background: var(--panel); border-left: 1px solid var(--rule); display: flex; flex-direction: column; overflow: hidden; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .card .big { font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1.1; }
  .card.expired .big { color: var(--hot); } .card.d30 .big { color: var(--bad); } .card.d60 .big { color: var(--warn); } .card.d90 .big { color: var(--accent); }
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input { width: auto; min-width: 120px; }
  textarea { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); padding: 6px 8px; border-bottom: 1px solid var(--rule); cursor: pointer; white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:hover td { background: var(--panel); }
  td .name { font-weight: 600; cursor: pointer; color: var(--text); }
  td .name:hover { color: var(--accent); }
  .pill { font-family: var(--mono); font-size: 10px; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .pill.expired { background: rgba(224,112,112,.18); color: var(--hot); }
  .pill.d30 { background: rgba(217,139,122,.18); color: var(--bad); }
  .pill.d60 { background: rgba(217,161,91,.18); color: var(--warn); }
  .pill.d90 { background: rgba(127,183,214,.15); color: var(--accent); }
  .pill.ok { background: rgba(127,214,168,.15); color: var(--ok); }
  .pill.none { background: rgba(87,96,114,.2); color: var(--dim); }
  .person-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .person-head h2 { margin: 0; font-size: 18px; }
  .cred .t { font-weight: 600; }
  .cred .m { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .queue { background: var(--panel-2); border: 1px solid var(--warn); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; }
  .queue pre { font-family: var(--mono); font-size: 11px; white-space: pre-wrap; margin: 6px 0 0; color: var(--dim); max-height: 160px; overflow: auto; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "bar" "main" "side"; } .side { max-height: 45vh; border-left: 0; border-top: 1px solid var(--rule); } .cards { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="bar">
  <div class="logo">Credentials<small>licence &amp; certification watch</small></div>
  <div class="status" id="status"></div>
  <div class="spacer"></div>
  <button id="btnBrief" class="primary" title="Files one brief listing everything expiring within 30 days">Weekly compliance brief</button>
  <button id="btnAddPerson">+ Person</button>
  <button id="btnImport">Import CSV</button>
  <button id="btnExportCsv">Export CSV</button>
  <button id="btnExportJson">Export JSON</button>
</div>
<div class="main" id="main" data-stagger></div>
<div class="side">
  <div class="tabs">
    <button class="active" data-tab="person">Person</button>
    <button data-tab="tools">Tools</button>
  </div>
  <div class="panel" id="side" data-stagger></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ------------------------------------------------------------- persistence
// window.roost.store when hosted by the Ifreglen shell (key/value scoped to
// this app); localStorage otherwise so the page works in any browser. Both
// hold the same single JSON document, so switching hosts is a copy-paste of
// the export, not a migration.
const STORE_KEY = "credentials.v1";
const roost = window.roost || null;
const store = {
  async get() {
    if (roost && roost.store) { const v = await roost.store.get(STORE_KEY); return v && typeof v === "object" ? v : null; }
    try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; }
  },
  async set(doc) {
    if (roost && roost.store) return roost.store.set(STORE_KEY, doc);
    localStorage.setItem(STORE_KEY, JSON.stringify(doc));
  },
};
// Briefs go to the shell over the bus as topic "briefs.file" with
// {title, body, level?, url?}. Without a bus they queue in localStorage and
// show in-app, so a browser session still shows what *would* have gone out.
const BRIEF_QUEUE_KEY = "credentials.briefQueue";
async function fileBrief(brief) {
  if (roost && roost.bus) { const r = await roost.bus.publish("briefs.file", brief); return !(r && r.error); }
  const q = JSON.parse(localStorage.getItem(BRIEF_QUEUE_KEY) || "[]");
  q.push({ ...brief, when: new Date().toISOString() });
  localStorage.setItem(BRIEF_QUEUE_KEY, JSON.stringify(q.slice(-20)));
  return false;
}
const briefQueue = () => JSON.parse(localStorage.getItem(BRIEF_QUEUE_KEY) || "[]");

// ------------------------------------------------------------- domain
const ROLES = ["RN", "LPN", "CNA", "MA", "NP", "PA", "MD", "Pharmacist", "Tech", "Admin", "Other"];
const TYPES = ["State licence", "BLS", "ACLS", "PALS", "NRP", "TB test", "Flu vaccine", "Hep B", "N95 fit test", "Background check", "Mandatory training", "Other"];
const STATUSES = ["active", "leave", "PRN", "terminated"];
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const daysUntil = (d) => d ? Math.round((Date.parse(d) - Date.parse(today())) / 86400000) : null;
// Bucket by days to expiry. "none" means no expiry recorded (e.g. a
// background check kept on file), which is neither good nor bad.
function bucket(cred) {
  const n = daysUntil(cred.expires);
  if (n === null) return "none";
  if (n < 0) return "expired"; if (n <= 30) return "d30"; if (n <= 60) return "d60"; if (n <= 90) return "d90"; return "ok";
}
const BUCKET_LABEL = { expired: "expired", d30: "≤30d", d60: "≤60d", d90: "≤90d", ok: "current", none: "no expiry" };
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

let doc = { people: [], creds: [] };
let ui = { tab: "person", personId: null, filter: { dept: "", role: "", type: "", status: "", q: "" }, sort: "expires", view: "table" };
const save = () => store.set(doc);
const personOf = (c) => doc.people.find((p) => p.id === c.personId);

// ------------------------------------------------------------- main view
function render() {
  const main = $("#main");
  const b = { expired: 0, d30: 0, d60: 0, d90: 0 };
  for (const c of doc.creds) { const k = bucket(c); if (k in b) b[k]++; }
  const depts = [...new Set(doc.people.map((p) => p.dept).filter(Boolean))].sort();
  const f = ui.filter;
  let rows = doc.creds.map((c) => ({ c, p: personOf(c) || { name: "(unknown)" }, k: bucket(c), n: daysUntil(c.expires) }));
  if (f.dept) rows = rows.filter((r) => r.p.dept === f.dept);
  if (f.role) rows = rows.filter((r) => r.p.role === f.role);
  if (f.type) rows = rows.filter((r) => r.c.type === f.type);
  if (f.status) rows = rows.filter((r) => f.status === "ok" ? (r.k === "ok" || r.k === "none") : r.k === f.status);
  if (f.q) { const q = f.q.toLowerCase(); rows = rows.filter((r) => (r.p.name + " " + r.c.type + " " + r.c.issuer + " " + (r.p.unit || "")).toLowerCase().includes(q)); }
  rows.sort((a, b2) => ui.sort === "name" ? a.p.name.localeCompare(b2.p.name) : ui.sort === "type" ? a.c.type.localeCompare(b2.c.type) : ((a.c.expires || "9999") > (b2.c.expires || "9999") ? 1 : -1));

  main.innerHTML = `
    <div class="cards">
      ${["expired", "d30", "d60", "d90"].map((k) => `<div class="card ${k} ${f.status === k ? "on" : ""}" data-k="${k}"><div class="overline">${k === "expired" ? "Already expired" : "Expiring in " + k.slice(1) + " days"}</div><div class="big">${b[k]}</div></div>`).join("")}
    </div>
    ${briefQueue().length && !(roost && roost.bus) ? `<div class="queue"><b>${briefQueue().length} brief(s) queued</b> — no shell bus here, so they were kept locally. Latest:<pre>${esc(briefQueue().slice(-1)[0].title + "\n" + briefQueue().slice(-1)[0].body)}</pre><button class="sm" id="clearQueue">Clear queue</button></div>` : ""}
    <div class="filters">
      <input id="f-q" placeholder="search…" value="${esc(f.q)}">
      <select id="f-dept"><option value="">all depts</option>${depts.map((d) => `<option ${f.dept === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
      <select id="f-role"><option value="">all roles</option>${ROLES.map((r) => `<option ${f.role === r ? "selected" : ""}>${r}</option>`).join("")}</select>
      <select id="f-type"><option value="">all types</option>${TYPES.map((t) => `<option ${f.type === t ? "selected" : ""}>${t}</option>`).join("")}</select>
      <select id="f-status"><option value="">any status</option>${["expired", "d30", "d60", "d90", "ok"].map((k) => `<option value="${k}" ${f.status === k ? "selected" : ""}>${BUCKET_LABEL[k]}</option>`).join("")}</select>
      <span class="overline">${rows.length} of ${doc.creds.length} · ${doc.people.length} people</span>
    </div>
    ${doc.people.length === 0 ? `<div class="empty"><div class="glyph">[ ]</div>No staff yet. Add a person, import a CSV, or load demo data from the Tools tab.</div>` : rows.length === 0 ? `<div class="empty">Nothing matches these filters.</div>` : `
    <table><thead><tr><th data-s="name">Person</th><th>Role · Dept</th><th data-s="type">Credential</th><th>Issuer</th><th data-s="expires">Expires</th><th>Status</th><th>Verified</th><th></th></tr></thead><tbody>
      ${rows.map((r) => `<tr>
        <td><span class="name" data-p="${r.p.id}">${esc(r.p.name)}</span></td>
        <td>${esc(r.p.role || "")}${r.p.dept ? " · " + esc(r.p.dept) : ""}${r.p.unit ? " / " + esc(r.p.unit) : ""}</td>
        <td>${esc(r.c.type)}${r.c.number ? ` <span class="overline">#${esc(r.c.number)}</span>` : ""}</td>
        <td>${esc(r.c.issuer || "")}</td>
        <td style="font-family:var(--mono);font-size:12px">${esc(r.c.expires || "—")}${r.n !== null ? ` <span style="color:var(--faint)">(${r.n < 0 ? Math.abs(r.n) + "d ago" : "in " + r.n + "d"})</span>` : ""}</td>
        <td><span class="pill ${r.k}">${BUCKET_LABEL[r.k]}</span></td>
        <td style="font-family:var(--mono);font-size:12px">${r.c.verifiedOn ? esc(r.c.verifiedOn) : "<span style='color:var(--faint)'>—</span>"}${r.c.verifyUrl ? ` <a href="${esc(r.c.verifyUrl)}" target="_blank" rel="noopener" title="open verification page">↗</a>` : ""}</td>
        <td><button class="sm" data-edit="${r.c.id}">edit</button></td>
      </tr>`).join("")}
    </tbody></table>`}`;
  main.querySelectorAll(".card").forEach((el) => el.onclick = () => { ui.filter.status = ui.filter.status === el.dataset.k ? "" : el.dataset.k; render(); });
  $("#f-q").oninput = (e) => { ui.filter.q = e.target.value; render(); $("#f-q").focus(); $("#f-q").setSelectionRange(99, 99); };
  for (const k of ["dept", "role", "type", "status"]) $(`#f-${k}`).onchange = (e) => { ui.filter[k] = e.target.value; render(); };
  main.querySelectorAll("th[data-s]").forEach((th) => th.onclick = () => { ui.sort = th.dataset.s; render(); });
  main.querySelectorAll("[data-p]").forEach((el) => el.onclick = () => openPerson(el.dataset.p));
  main.querySelectorAll("[data-edit]").forEach((el) => el.onclick = () => { const c = doc.creds.find((x) => x.id === el.dataset.edit); openPerson(c.personId); credForm(c); });
  if ($("#clearQueue")) $("#clearQueue").onclick = () => { localStorage.removeItem(BRIEF_QUEUE_KEY); render(); };
  $("#status").textContent = (roost ? "shell store" : "browser storage") + (roost && roost.bus ? " · bus" : " · no bus (briefs queue locally)");
}

// ------------------------------------------------------------- side: person
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { ui.tab = b.dataset.tab; renderSide(); });
function renderSide() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === ui.tab));
  if (ui.tab === "tools") return renderTools();
  const p = doc.people.find((x) => x.id === ui.personId);
  if (!p) { $("#side").innerHTML = `<div class="empty"><div class="glyph">←</div>Pick a person from the table, or add one.</div><div class="acts" style="justify-content:center"><button class="primary" id="s-add">+ Person</button></div>`; $("#s-add").onclick = () => personForm(); return; }
  const creds = doc.creds.filter((c) => c.personId === p.id).sort((a, b) => (a.expires || "9999") > (b.expires || "9999") ? 1 : -1);
  $("#side").innerHTML = `
    <div class="person-head"><h2>${esc(p.name)}</h2><span class="overline">${esc(p.role)}${p.status && p.status !== "active" ? " · " + esc(p.status) : ""}</span></div>
    <div class="overline" style="margin-bottom:10px">${esc(p.dept || "—")}${p.unit ? " / " + esc(p.unit) : ""} · hired ${esc(p.hireDate || "—")}</div>
    <div class="acts" style="margin-bottom:12px"><button class="sm primary" id="p-addcred">+ Credential</button><button class="sm" id="p-edit">Edit person</button><button class="sm" id="p-draft">Reminder draft</button><button class="sm danger" id="p-del">Remove</button></div>
    ${creds.length ? creds.map((c) => { const k = bucket(c); return `<div class="cred"><div><div class="t">${esc(c.type)}${c.number ? ` <span class="overline">#${esc(c.number)}</span>` : ""}</div><div class="m">${esc(c.issuer || "")}${c.issued ? " · issued " + esc(c.issued) : ""}${c.expires ? " · expires " + esc(c.expires) : ""}${c.verifiedOn ? " · verified " + esc(c.verifiedOn) : ""}</div>${c.notes ? `<div class="m" style="color:var(--text)">${esc(c.notes)}</div>` : ""}</div><div style="text-align:right"><span class="pill ${k}">${BUCKET_LABEL[k]}</span><br><button class="sm" data-ce="${c.id}" style="margin-top:6px">edit</button></div></div>`; }).join("") : `<div class="empty">No credentials recorded.</div>`}
    <div id="s-form"></div>`;
  $("#p-addcred").onclick = () => credForm({ personId: p.id });
  $("#p-edit").onclick = () => personForm(p);
  $("#p-draft").onclick = () => showDraft(p);
  $("#p-del").onclick = () => { if (!confirm(`Remove ${p.name} and all their credentials?`)) return; doc.people = doc.people.filter((x) => x.id !== p.id); doc.creds = doc.creds.filter((c) => c.personId !== p.id); ui.personId = null; save(); render(); renderSide(); };
  $("#side").querySelectorAll("[data-ce]").forEach((b) => b.onclick = () => credForm(doc.creds.find((c) => c.id === b.dataset.ce)));
}
function openPerson(pid) { ui.personId = pid; ui.tab = "person"; renderSide(); }

function personForm(p = {}) {
  ui.tab = "person"; document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === "person"));
  $("#side").innerHTML = `<div class="overline" style="margin-bottom:10px">${p.id ? "Edit person" : "New person"}</div>
    <div class="field"><div class="lbl">Name</div><input id="pf-name" value="${esc(p.name || "")}"></div>
    <div class="row"><div class="field"><div class="lbl">Role</div><select id="pf-role">${ROLES.map((r) => `<option ${p.role === r ? "selected" : ""}>${r}</option>`).join("")}</select></div>
    <div class="field"><div class="lbl">Status</div><select id="pf-status">${STATUSES.map((r) => `<option ${(p.status || "active") === r ? "selected" : ""}>${r}</option>`).join("")}</select></div></div>
    <div class="row"><div class="field"><div class="lbl">Department</div><input id="pf-dept" value="${esc(p.dept || "")}" list="depts"><datalist id="depts">${[...new Set(doc.people.map((x) => x.dept).filter(Boolean))].map((d) => `<option value="${esc(d)}">`).join("")}</datalist></div>
    <div class="field"><div class="lbl">Unit</div><input id="pf-unit" value="${esc(p.unit || "")}"></div></div>
    <div class="field"><div class="lbl">Hire date</div><input id="pf-hire" type="date" value="${esc(p.hireDate || "")}"></div>
    <div class="acts"><button class="primary" id="pf-save">${p.id ? "Save" : "Add"}</button><button id="pf-cancel">Cancel</button></div>`;
  $("#pf-cancel").onclick = renderSide;
  $("#pf-save").onclick = () => {
    const name = $("#pf-name").value.trim(); if (!name) return toast("Name is required");
    const rec = { id: p.id || uid(), name, role: $("#pf-role").value, status: $("#pf-status").value, dept: $("#pf-dept").value.trim(), unit: $("#pf-unit").value.trim(), hireDate: $("#pf-hire").value };
    if (p.id) Object.assign(doc.people.find((x) => x.id === p.id), rec); else doc.people.push(rec);
    ui.personId = rec.id; save(); render(); renderSide(); toast(p.id ? "Saved" : "Added " + name);
  };
}

function credForm(c) {
  const host = $("#s-form"); if (!host) return;
  host.innerHTML = `<div class="overline" style="margin:12px 0 8px">${c.id ? "Edit credential" : "New credential"}</div>
    <div class="row"><div class="field"><div class="lbl">Type</div><select id="cf-type">${TYPES.map((t) => `<option ${c.type === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="field"><div class="lbl">Number (optional)</div><input id="cf-number" value="${esc(c.number || "")}"></div></div>
    <div class="field"><div class="lbl">Issuer</div><input id="cf-issuer" value="${esc(c.issuer || "")}" placeholder="e.g. State Board of Nursing, AHA"></div>
    <div class="row"><div class="field"><div class="lbl">Issued</div><input id="cf-issued" type="date" value="${esc(c.issued || "")}"></div>
    <div class="field"><div class="lbl">Expires</div><input id="cf-expires" type="date" value="${esc(c.expires || "")}"></div></div>
    <div class="row"><div class="field"><div class="lbl">Verify URL</div><input id="cf-url" value="${esc(c.verifyUrl || "")}" placeholder="https://…"></div>
    <div class="field"><div class="lbl">Verified on</div><input id="cf-verified" type="date" value="${esc(c.verifiedOn || "")}"></div></div>
    <div class="field"><div class="lbl">Notes</div><input id="cf-notes" value="${esc(c.notes || "")}"></div>
    <div class="acts"><button class="primary" id="cf-save">${c.id ? "Save" : "Add"}</button><button id="cf-cancel">Cancel</button>${c.id ? `<button class="danger" id="cf-del">Delete</button>` : ""}</div>`;
  host.scrollIntoView({ block: "end" });
  $("#cf-cancel").onclick = renderSide;
  $("#cf-save").onclick = () => {
    const rec = { id: c.id || uid(), personId: c.personId, type: $("#cf-type").value, number: $("#cf-number").value.trim(), issuer: $("#cf-issuer").value.trim(), issued: $("#cf-issued").value, expires: $("#cf-expires").value, verifyUrl: $("#cf-url").value.trim(), verifiedOn: $("#cf-verified").value, notes: $("#cf-notes").value.trim() };
    if (c.id) Object.assign(doc.creds.find((x) => x.id === c.id), rec); else doc.creds.push(rec);
    save(); render(); renderSide(); toast("Saved");
  };
  if ($("#cf-del")) $("#cf-del").onclick = () => { doc.creds = doc.creds.filter((x) => x.id !== c.id); save(); render(); renderSide(); };
}

// ------------------------------------------------------------- drafts & briefs
// Plain templates, filled in locally. Nothing here calls a model: a reminder
// about someone's licence is personal data and stays on this machine.
function expiringFor(p, within = 90) {
  return doc.creds.filter((c) => c.personId === p.id && c.expires && daysUntil(c.expires) <= within).sort((a, b) => a.expires > b.expires ? 1 : -1);
}
function reminderDraft(p) {
  const items = expiringFor(p, 90);
  const line = (c) => { const n = daysUntil(c.expires); return `  - ${c.type}${c.issuer ? " (" + c.issuer + ")" : ""}: ${n < 0 ? "EXPIRED " + c.expires : "expires " + c.expires + " (" + n + " days)"}`; };
  return `Subject: Credential renewal reminder — ${p.name}

Hi ${p.name.split(" ")[0]},

Our records show the following credential${items.length === 1 ? "" : "s"} on file for you ${items.some((c) => daysUntil(c.expires) < 0) ? "need attention" : "will expire soon"}:

${items.map(line).join("\n") || "  (none within 90 days)"}

Please send a copy of the renewed credential to HR as soon as it is issued so we can update your file. If you have already renewed, reply with the new expiry date and we will correct our records.

Thank you,
Human Resources`;
}
function showDraft(p) {
  const text = reminderDraft(p);
  $("#side").innerHTML = `<div class="overline" style="margin-bottom:8px">Reminder draft · ${esc(p.name)}</div><pre class="draft">${esc(text)}</pre><div class="acts"><button class="primary" id="d-copy">Copy</button><button id="d-back">Back</button></div>`;
  $("#d-copy").onclick = () => navigator.clipboard.writeText(text).then(() => toast("Copied to clipboard"));
  $("#d-back").onclick = renderSide;
}
function complianceBriefText(within = 30) {
  const rows = doc.creds.filter((c) => c.expires && daysUntil(c.expires) <= within).map((c) => ({ c, p: personOf(c), n: daysUntil(c.expires) })).filter((r) => r.p && r.p.status !== "terminated").sort((a, b) => a.n - b.n);
  const expired = rows.filter((r) => r.n < 0), soon = rows.filter((r) => r.n >= 0);
  const line = (r) => `${r.p.name} · ${r.c.type} · ${r.c.expires}${r.n < 0 ? " (" + Math.abs(r.n) + "d overdue)" : " (" + r.n + "d)"}`;
  const body = [expired.length ? `EXPIRED (${expired.length}):\n` + expired.map(line).join("\n") : "", soon.length ? `Expiring within ${within} days (${soon.length}):\n` + soon.map(line).join("\n") : ""].filter(Boolean).join("\n\n") || `Nothing expiring within ${within} days. All clear.`;
  return { title: `Compliance brief: ${expired.length} expired, ${soon.length} expiring ≤${within}d`, body, level: expired.length ? "urgent" : soon.length ? "normal" : "quiet", count: rows.length };
}
$("#btnBrief").onclick = async () => {
  const b = complianceBriefText(30);
  const sent = await fileBrief({ title: b.title, body: b.body, level: b.level });
  toast(sent ? "Brief filed to the shell" : "No bus here — brief queued locally"); render();
};

// ------------------------------------------------------------- tools: import/export/demo
function csvEscape(v) { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
const CSV_COLS = ["name", "role", "dept", "unit", "hireDate", "status", "type", "number", "issuer", "issued", "expires", "verifyUrl", "verifiedOn", "notes"];
function exportCsv() {
  const lines = [CSV_COLS.join(",")];
  for (const p of doc.people) {
    const cs = doc.creds.filter((c) => c.personId === p.id);
    if (!cs.length) lines.push(CSV_COLS.map((k) => csvEscape(p[k])).join(","));
    for (const c of cs) lines.push(CSV_COLS.map((k) => csvEscape(k in c ? c[k] : p[k])).join(","));
  }
  return lines.join("\n");
}
// One row per credential; a person with no credential is a row with blank
// credential columns. People are matched on name (case-insensitive) so a
// re-import updates rather than duplicates.
function importCsv(text) {
  const rows = parseCsv(text); if (rows.length < 2) throw new Error("need a header row and at least one data row");
  const head = rows[0].map((h) => h.trim().replace(/\s+/g, "").toLowerCase());
  const col = (name) => head.indexOf(name.toLowerCase());
  const idx = Object.fromEntries(CSV_COLS.map((k) => [k, col(k)]));
  if (idx.name < 0) throw new Error("CSV needs a 'name' column");
  let people = 0, creds = 0;
  for (const r of rows.slice(1)) {
    const get = (k) => idx[k] >= 0 ? (r[idx[k]] || "").trim() : "";
    const name = get("name"); if (!name) continue;
    let p = doc.people.find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (!p) { p = { id: uid(), name, role: "Other", status: "active", dept: "", unit: "", hireDate: "" }; doc.people.push(p); people++; }
    for (const k of ["role", "dept", "unit", "hireDate", "status"]) if (get(k)) p[k] = get(k);
    if (!ROLES.includes(p.role)) p.role = "Other";
    const type = get("type");
    if (type) {
      const t = TYPES.find((x) => x.toLowerCase() === type.toLowerCase()) || "Other";
      const same = doc.creds.find((c) => c.personId === p.id && c.type === t && (c.number || "") === get("number") && (c.expires || "") === get("expires"));
      const rec = { id: same ? same.id : uid(), personId: p.id, type: t, number: get("number"), issuer: get("issuer"), issued: get("issued"), expires: get("expires"), verifyUrl: get("verifyUrl"), verifiedOn: get("verifiedOn"), notes: get("notes") };
      if (same) Object.assign(same, rec); else { doc.creds.push(rec); creds++; }
    }
  }
  save(); return { people, creds };
}
function download(name, text, type = "text/plain") {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#btnExportCsv").onclick = () => download(`credentials-${today()}.csv`, exportCsv(), "text/csv");
$("#btnExportJson").onclick = () => download(`credentials-${today()}.json`, JSON.stringify(doc, null, 2), "application/json");
